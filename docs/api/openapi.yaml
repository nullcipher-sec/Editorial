openapi: 3.0.3
info:
  title: Sultana del Lago Editores — Core API
  version: 1.0.0
  description: |
    Contrato del Core. Las rutas /api/internal/** exigen JWT (Bearer) obtenido en /api/auth/login y el rol ROLE_<AREA> correspondiente; sin token responden 401 y con rol equivocado 403.

servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: http://10.20.30.10:8080
    description: SRV-Apps-E

tags:
  - name: Public
  - name: Auth
  - name: Internal

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login against LDAP, returns JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: JWT issued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/public/articles:
    get:
      tags: [Public]
      security: []
      summary: List published articles (noticiero)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePage'

  /api/public/articles/{id}:
    get:
      tags: [Public]
      security: []
      summary: Get one published article
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticle'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/attention/clients:
    get:
      tags: [Internal]
      summary: List clients (Atención)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      summary: Create client
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/attention/clients/{id}:
    delete:
      tags: [Internal]
      summary: Delete a client (Atención only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/attention/cases:
    get:
      tags: [Internal]
      summary: List support cases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/attention/cases/{id}:
    delete:
      tags: [Internal]
      summary: Delete a support case (Atención only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/content/articles:
    get:
      tags: [Internal]
      summary: List all articles (any status) for Producción
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/content/articles/{id}:
    delete:
      tags: [Internal]
      summary: Delete an article (Producción only)
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/content/articles/{id}/publish:
    patch:
      tags: [Internal]
      summary: Mark article as published
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/hr/employees:
    get:
      tags: [Internal]
      summary: List employees (HR)
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      summary: Create employee (HR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeCode, fullName, email, department]
              properties:
                employeeCode: {type: string, maxLength: 32}
                fullName: {type: string}
                email: {type: string, format: email}
                department: {type: string, enum: [ATTENTION, PRODUCTION, RECRUITMENT, HR, MARKETING]}
                hiredAt: {type: string, format: date}
      responses:
        '200':
          description: Employee created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: employeeCode already exists

  /api/internal/hr/employees/{id}:
    delete:
      tags: [Internal]
      summary: Delete / dismiss an employee from their position (HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/hr/job-openings:
    get:
      tags: [Internal]
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/hr/job-openings/{id}:
    delete:
      tags: [Internal]
      summary: Delete a job opening (HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/hr/candidates/{id}/accept:
    post:
      tags: [Internal]
      summary: Accept a candidate and hire as permanent employee (HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/hr/candidates/{id}:
    delete:
      tags: [Internal]
      summary: Remove / discard a candidate from a job opening (HR only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/recruitment/candidates:
    get:
      tags: [Internal]
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/recruitment/candidates/{id}:
    delete:
      tags: [Internal]
      summary: Delete / withdraw a candidate (Recruitment only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/events:
    get:
      tags: [Internal]
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/events/{id}:
    delete:
      tags: [Internal]
      summary: Cancel / delete an event (Marketing only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/marketing/campaigns:
    get:
      tags: [Internal]
      responses:
        '200':
          description: OK
    post:
      tags: [Internal]
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Access denied (role does not match area)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

    PublicArticle:
      type: object
      required: [id, title, body]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        publishedAt:
          type: string
          format: date-time

    PublicArticlePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublicArticle'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
