# Redes que reproducen las VLAN de la topología (SW-Core-E no enruta;
# todo el tráfico entre zonas pasa por el firewall FW-E).
# Responsable: @luiscab19 (ver issue de Infraestructura)
networks:
  red_gestion:   # VLAN 10  - 10.20.10.0/24
    driver: bridge
    ipam: { config: [{ subnet: 10.20.10.0/24 }] }
  red_dmz:       # VLAN 20  - 10.20.20.0/24
    driver: bridge
    ipam: { config: [{ subnet: 10.20.20.0/24 }] }
  red_apps:      # VLAN 30  - 10.20.30.0/24
    driver: bridge
    ipam: { config: [{ subnet: 10.20.30.0/24 }] }
  red_datos:     # VLAN 40  - 10.20.40.0/24
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 10.20.40.0/24 }] }
  red_respaldo:  # VLAN 50  - 10.20.50.0/24
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 10.20.50.0/24 }] }

services: {}
