# Topología provisional — responsable infra: @luiscab19
version: "3.9"

networks:
  red_gestion:
    driver: bridge
    ipam: { config: [{ subnet: 10.20.10.0/24 }] }
  red_dmz:
    driver: bridge
    ipam: { config: [{ subnet: 10.20.20.0/24 }] }
  red_apps:
    driver: bridge
    ipam: { config: [{ subnet: 10.20.30.0/24 }] }
  red_datos:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 10.20.40.0/24 }] }
  red_bkup:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 10.20.50.0/24 }] }

services:
  firewall:
    build: ./firewall
    container_name: fw-e
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      red_gestion: { ipv4_address: 10.20.10.10 }
      red_dmz: { ipv4_address: 10.20.20.2 }
      red_apps: { ipv4_address: 10.20.30.2 }
      red_datos: { ipv4_address: 10.20.40.2 }
      red_bkup: { ipv4_address: 10.20.50.2 }

  nginx:
    image: nginx:1.27-alpine
    container_name: srv-dmz-nginx
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID] 
    expose: ["443", "80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
      - nginx_run:/var/run
    networks:
      red_dmz: { ipv4_address: 10.20.20.10 }
    depends_on:
      firewall: { condition: service_started }

  database:
    image: postgres:16-alpine
    container_name: srv-datos-pg
    env_file: [.env]
    volumes:
      - ./db_init/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    networks:
      red_datos: { ipv4_address: 10.20.40.10 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    container_name: srv-apps-ldap
    environment:
      LDAP_ORGANISATION: Sultana del Lago
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    expose: ["389"]
    networks:
      red_apps: { ipv4_address: 10.20.30.20 }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/389' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: alpine:3.20
    container_name: srv-bkup
    command: sh -c "apk add --no-cache postgresql16-client age bash && /backup.sh"
    env_file: [.env]
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./secrets:/secrets:ro
      - backup_data:/backups
    networks:
      red_bkup: { ipv4_address: 10.20.50.10 }
    depends_on:
      database: { condition: service_healthy }

  core:
    image: alpine:3.20
    container_name: srv-apps-core
    read_only: true
    cap_drop: [ALL]
    command: tail -f /dev/null
    expose: ["8080"]
    networks:
      red_apps: { ipv4_address: 10.20.30.10 }
    depends_on:
      database: { condition: service_healthy }
      ldap: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s

  core2:
    image: alpine:3.20
    container_name: srv-apps-core2
    read_only: true
    cap_drop: [ALL]
    command: tail -f /dev/null
    expose: ["8080"]
    networks:
      red_apps: { ipv4_address: 10.20.30.11 }
    depends_on:
      database: { condition: service_healthy }
      ldap: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s

  tui:
    image: alpine:3.20
    container_name: srv-apps-tui
    read_only: true
    cap_drop: [ALL]
    command: tail -f /dev/null
    expose: ["3000"]
    networks:
      red_apps: { ipv4_address: 10.20.30.30 }
    depends_on:
      core: { condition: service_started }

  noticiero:
    image: alpine:3.20
    container_name: srv-dmz-noticiero
    read_only: true
    cap_drop: [ALL]
    command: tail -f /dev/null
    expose: ["80"]
    networks:
      red_dmz: { ipv4_address: 10.20.20.11 }
    depends_on:
      firewall: { condition: service_started }

volumes:
  pgdata:
  backup_data:
  ldap_data:
  ldap_config:
  nginx_cache:
  nginx_run:
