# Entorno local de fase 1: Postgres + Core (no sustituye la topología completa de @luiscab19).
name: editorial-dev

networks:
  red_datos:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.40.0/24
  red_apps:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
  red_atencion:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.210.0/24
  red_produccion:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.220.0/24
  red_reclutamiento:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.230.0/24
  red_rrhh:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.240.0/24
  red_eventos:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.250.0/24

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-editorial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db_init/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db_init/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      red_datos:
        ipv4_address: 10.20.40.10

  ldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    environment:
      LDAP_ORGANISATION: Sultana del Lago
      LDAP_DOMAIN: editorial.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin_dev_only}
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-D", "cn=admin,dc=editorial,dc=local", "-w", "admin_dev_only", "-b", "ou=people,dc=editorial,dc=local", "-s", "base", "(objectClass=*)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      red_apps:
        ipv4_address: 10.20.30.20

  editorial_core:
    build:
      context: ../services/editorial_core
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CORE_PORT: 8080
      POSTGRES_HOST: 10.20.40.10
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-editorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editorial_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-editorial}
      EDITORIAL_JWT_SECRET: ${EDITORIAL_JWT_SECRET:-local-dev-only-secret-32-chars-min!!}
      EDITORIAL_LDAP_ENABLED: "true"
      LDAP_URL: ldap://10.20.30.20:389
      LDAP_MANAGER_DN: cn=admin,dc=editorial,dc=local
      LDAP_MANAGER_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin_dev_only}
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_started
      ldap:
        condition: service_healthy
    networks:
      red_apps:
        ipv4_address: 10.20.30.10
      red_datos: {}

  noticiero:
    build:
      context: ../services/editorial_noticiero
      dockerfile: Dockerfile
    environment:
      CORE_URL: http://10.20.30.10:8080
    ports:
      - "${NOTICIERO_PORT:-3000}:8080"
    depends_on:
      - editorial_core
    networks:
      red_apps: {}

  tui_atencion:
    profiles: ["tui"]
    build:
      context: ../services/editorial_tui
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://10.20.30.10:8080
      TERMINAL_AREA: ATTENTION
    depends_on:
      - editorial_core
    stdin_open: true
    tty: true
    networks:
      red_atencion: {}
      red_apps: {}

  tui_produccion:
    profiles: ["tui"]
    build:
      context: ../services/editorial_tui
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://10.20.30.10:8080
      TERMINAL_AREA: PRODUCTION
    depends_on:
      - editorial_core
    stdin_open: true
    tty: true
    networks:
      red_produccion: {}
      red_apps: {}

  tui_reclutamiento:
    profiles: ["tui"]
    build:
      context: ../services/editorial_tui
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://10.20.30.10:8080
      TERMINAL_AREA: RECRUITMENT
    depends_on:
      - editorial_core
    stdin_open: true
    tty: true
    networks:
      red_reclutamiento: {}
      red_apps: {}

  tui_rrhh:
    profiles: ["tui"]
    build:
      context: ../services/editorial_tui
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://10.20.30.10:8080
      TERMINAL_AREA: HR
    depends_on:
      - editorial_core
    stdin_open: true
    tty: true
    networks:
      red_rrhh: {}
      red_apps: {}

  tui_eventos:
    profiles: ["tui"]
    build:
      context: ../services/editorial_tui
      dockerfile: Dockerfile
    environment:
      CORE_API_URL: http://10.20.30.10:8080
      TERMINAL_AREA: MARKETING
    depends_on:
      - editorial_core
    stdin_open: true
    tty: true
    networks:
      red_eventos: {}
      red_apps: {}
