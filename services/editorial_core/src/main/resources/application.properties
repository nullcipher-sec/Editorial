spring.application.name=editorial-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${CORE_PORT:8080}
spring.threads.virtual.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:editorial}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# El esquema lo define deploy/db_init/db.sql; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
