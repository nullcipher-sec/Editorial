# Documentación interactiva (Scalar) solo en desarrollo local; sin Swagger UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# Scalar en /scalar; especificación en /v3/api-docs (sin telemetría ni agente).
scalar.enabled=true
scalar.page-title=Sultana del Lago — Core API
scalar.theme=purple
scalar.telemetry=false
scalar.agent.disabled=true
scalar.show-developer-tools=never

# Evita usuario temporal auto-generado por Spring Security en dev (auth LDAP llegará en fase 2).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.org.springframework.security=INFO
