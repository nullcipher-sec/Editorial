# Documentación interactiva (Scalar) solo en desarrollo local; sin Swagger UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# Scalar en /scalar; especificación en /v3/api-docs (sin telemetría ni agente).
scalar.enabled=true
scalar.page-title=Sultana del Lago Editores — Core API
scalar.theme=none
scalar.telemetry=false
scalar.agent.disabled=true
scalar.show-developer-tools=never
scalar.with-default-fonts=false

# Evita usuario temporal auto-generado por Spring Security en dev (auth LDAP llegará en fase 2).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

editorial.jwt.secret=${EDITORIAL_JWT_SECRET:local-dev-only-secret-32-chars-min!!}
editorial.ldap.enabled=${EDITORIAL_LDAP_ENABLED:true}
editorial.ldap.url=${LDAP_URL:ldap://10.20.30.20:389}
editorial.ldap.manager-dn=${LDAP_MANAGER_DN:cn=admin,dc=editorial,dc=local}
editorial.ldap.manager-password=${LDAP_MANAGER_PASSWORD:admin_dev_only}

logging.level.org.springframework.security=INFO
